benchmark:
  name: libero_spatial_task0_v0
  num_episodes: 1
  seed: 7

simulator:
  type: libero
  render_mode: rgb_array
  params:
    suite_name: libero_spatial
    task_id: 0
    task_order_index: 0
    init_state_id: 0
    horizon: 200
    control_freq: 20
    camera_names: [agentview, robot0_eye_in_hand]
    camera_height: 128
    camera_width: 128

task:
  type: libero_generic
  max_steps: 200
  success_threshold: 1.0
  params:
    suite_name: libero_spatial
    task_id: 0
    task_order_index: 0
    init_state_id: 0
    language_instruction: pick up the black bowl between the plate and the ramekin and place it on the plate
    no_language_baseline: false
    random_baseline: true
    benchmark_validity:
      language_instruction: pick up the black bowl between the plate and the ramekin and place it on the plate
      suite_name: libero_spatial
      task_id: 0
      init_state_id: 0
      no_language_baseline: false
      random_baseline: true

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: agentview
      type: libero_rgb
      width: 128
      height: 128
    - name: robot0_eye_in_hand
      type: libero_rgb
      width: 128
      height: 128

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  params:
    scale_mode: libero_osc_pose_delta

controller:
  type: libero_delta_eef
  frame: controller
  scales:
    dx: 0.05
    dy: 0.05
    dz: 0.05
    droll: 0.1
    dpitch: 0.1
    dyaw: 0.1
    gripper: 1.0
  params:
    gripper_open_value: -1.0
    gripper_closed_value: 1.0

agent:
  type: random
  invalid_action_recovery: noop
  history_window: 5

logging:
  output_dir: outputs/libero_spatial_task0
  save_images: false
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

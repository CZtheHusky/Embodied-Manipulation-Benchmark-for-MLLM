benchmark:
  name: dummy_reach_v0
  num_episodes: 2
  seed: 42

simulator:
  type: dummy
  control_dt: 0.1
  workspace_bounds:
    low: [-1.0, -1.0, 0.0]
    high: [1.0, 1.0, 1.0]

task:
  type: reach_target
  max_steps: 50
  success_threshold: 0.05
  target_position: [0.4, 0.2, 0.3]
  initial_ee_position: [0.0, 0.0, 0.2]

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: front
      type: dummy_rgb
      width: 256
      height: 256
      pose: [1.0, 0.0, 0.8, 0.0, 0.6, 3.14]

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true

controller:
  type: ee_delta_pose
  frame: base
  scales:
    dx: 0.02
    dy: 0.02
    dz: 0.02
    droll: 0.05
    dpitch: 0.05
    dyaw: 0.05

agent:
  type: scripted
  invalid_action_recovery: noop
  history_window: 5

logging:
  output_dir: outputs/dummy_reach
  save_images: true
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

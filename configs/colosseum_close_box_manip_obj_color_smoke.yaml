benchmark:
  name: colosseum_close_box_manip_obj_color_smoke_v0
  num_episodes: 1
  seed: 11

simulator:
  type: colosseum
  env_id: close_box
  control_dt: 0.1
  workspace_bounds:
    low: [-0.6, -0.6, 0.75]
    high: [0.6, 0.6, 1.35]
  params:
    task_name: close_box
    spreadsheet_idx: 2
    perturbation: manip_obj_color
    action_mode: move_arm_then_gripper_end_effector_pose_via_planning_discrete
    headless: false
    static_positions: false

task:
  type: rlbench_generic
  max_steps: 1
  success_threshold: 1.0
  params:
    instruction: Close the box lid.
    success_key: success

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: front
      type: rlbench_rgb
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz]
  gripper: none
  channel_kind: discrete
  channel_values: [0]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  params:
    scale_mode: rlbench_absolute_pose_target_from_delta_eef

controller:
  type: rlbench_delta_eef
  frame: controller
  scales:
    dx: 0.02
    dy: 0.02
    dz: 0.02
  params:
    dimensions: [dx, dy, dz]
    default_gripper: 1.0

agent:
  type: random
  invalid_action_recovery: noop
  history_window: 5

logging:
  output_dir: outputs/colosseum_close_box_manip_obj_color_smoke
  save_images: false
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: front

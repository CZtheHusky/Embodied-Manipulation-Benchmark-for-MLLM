benchmark:
  name: libero_spatial_task0_mllm_chat_completions_perturbed_v0
  num_episodes: 1
  seed: 7

simulator:
  type: libero
  render_mode: rgb_array
  params:
    suite_name: libero_spatial
    task_id: 0
    task_order_index: 0
    init_state_strategy: seed_modulo
    settling_steps: 5
    horizon: 600
    control_freq: 20
    camera_names: [agentview, robot0_eye_in_hand]
    camera_height: 128
    camera_width: 128

task:
  type: libero_generic
  max_steps: 600
  success_threshold: 1.0
  params:
    suite_name: libero_spatial
    task_id: 0
    task_order_index: 0
    init_state_strategy: seed_modulo
    language_instruction: pick up the black bowl between the plate and the ramekin and place it on the plate
    reject_initial_success: true
    no_language_baseline: false
    random_baseline: false
    benchmark_validity:
      language_instruction: pick up the black bowl between the plate and the ramekin and place it on the plate
      suite_name: libero_spatial
      task_id: 0
      init_state_strategy: seed_modulo
      no_language_baseline: false
      random_baseline: false

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: agentview
      type: libero_rgb
      width: 512
      height: 512
      params:
        basis_frame: mujoco_world
        image_right_in_world: [0.0, 1.0, 0.0]
        image_up_in_world: [-0.628, 0.0, 0.778]
        basis_approximate: true
    - name: robot0_eye_in_hand
      type: libero_rgb
      width: 128
      height: 128

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: binary
  channel_kind: continuous
  channel_min: -30
  channel_max: 30
  mapping_strategy: permuted_sign_flipped
  visible_metadata: true
  mapping_visible_to_agent: false
  frame_transform: random_rotation_3d
  frame_visible_to_agent: false
  control_frame_description: >-
    the LIBERO MuJoCo world Cartesian x, y, and z axes used by robosuite's
    OSC_POSE controller; translation deltas and right-hand axis-angle
    rotation-vector commands are applied in this world frame. A mapped
    magnitude-1 benchmark command produces +/-0.01 m translation or
    +/-0.0314159265358979 rad (1.8 degrees) rotation, and in
    upright agentview image right is approximately +world y while image up is
    approximately -0.628 world x +0.778 world z. robot0_eye_in_hand moves with
    the wrist, so it has no fixed world-axis projection
  gripper_open_command: 0
  gripper_closed_command: 1
  params:
    scale_mode: normalized_robosuite_osc_pose_input
    control_frame: mujoco_world
    rotation_convention: right_hand_axis_angle_rotvec
    native_translation_gain_m: 0.05
    native_rotation_gain_rad: 0.5
    sign_compensation: false

controller:
  type: libero_delta_eef
  frame: world
  scales:
    dx: 0.2
    dy: 0.2
    dz: 0.2
    droll: 0.0628318530717959
    dpitch: 0.0628318530717959
    dyaw: 0.0628318530717959
    gripper: 1.0
  params:
    gripper_open_value: -1.0
    gripper_closed_value: 1.0

agent:
  type: mllm
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras:
      - agentview
      - robot0_eye_in_hand
    image_max_side: 512
  history:
    action_window: all
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/libero_spatial_task0_mllm
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: agentview
  window_width: 720
  window_height: 540
  info_panel_height: 190
  fps: 20
  max_steps: 600
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true
  mujoco_gl: egl

benchmark:
  name: pusher_delta_eef_mllm_chat_completions_random_view_default_action_v1
  num_episodes: 10
  seed: 7

simulator:
  type: gymnasium
  env_id: MLLMTeleop/PusherDeltaEEF-v0
  render_mode: rgb_array
  frame_skip: 5
  params:
    max_episode_steps: 500
  env_kwargs:
    eef_step_scale: 0.01
    goal_distance_threshold: 0.08
    goal_hold_steps: 3
    workspace_low: [0.1, -0.65, -0.25]
    workspace_high: [0.95, 0.35, 0.25]
    ik_damping: 0.05
    ik_step_scale: 0.75
    ik_max_joint_delta: 0.12
    ik_iters: 20

task:
  type: gymnasium_pusher
  max_steps: 120
  success_threshold: 0.08
  goal_hold_steps: 3

camera:
  manager: mujoco_randomized
  visible_metadata: true
  params:
    experiment_condition: random_view
    distance_range: [1.6, 2.4]
    azimuth_range: [120.0, 180.0]
    elevation_range: [-35.0, -15.0]
    lookat: [0.45, -0.15, -0.15]
  cameras:
    - name: front
      type: mujoco_rgb
      width: 512
      height: 512

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz]
  gripper: none
  channel_kind: continuous
  channel_min: -30
  channel_max: 30
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the Gymnasium Pusher world x, y, and z axes. A mapped magnitude-1
    translation command moves the end-effector target by 0.01 meters. The
    front camera pose is randomly sampled at episode reset and then remains
    fixed for that episode, so image directions do not have a fixed world-axis
    projection across episodes
  params:
    scale_mode: uniform_env_eef_step_scale_0.01m

controller:
  type: pusher_delta_eef
  frame: world_xyz
  scales:
    dx: 1.0
    dy: 1.0
    dz: 1.0
  params:
    dimensions: [dx, dy, dz]

agent:
  type: mllm
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [front]
    image_max_side: 512
  history:
    action_window: 3
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/pusher_delta_eef_mllm
  save_images: false
  save_video: true
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  window_width: 720
  window_height: 540
  info_panel_height: 190
  fps: 20
  max_steps: 500
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true
  mujoco_gl: egl

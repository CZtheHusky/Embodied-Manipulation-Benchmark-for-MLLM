benchmark:
  name: robosuite_lift_v0
  num_episodes: 1
  seed: 42

simulator:
  type: robosuite

task:
  type: robosuite_lift
  max_steps: 100
  success_threshold: 0.04
  params:
    env_name: Lift
    reject_initial_success: true
    robots: ["Panda"]
    camera_names: ["agentview", "robot0_eye_in_hand"]
    camera_width: 320
    camera_height: 240

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: agentview
      width: 320
      height: 240
    - name: robot0_eye_in_hand
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: ["dx", "dy", "dz"]
  gripper: direct
  mapping_strategy: fixed
  frame_transform: identity
  control_frame_description: >-
    the robosuite OSC MuJoCo world frame. A mapped magnitude-1 translation
    command produces an approximately 0.01-meter end-effector target delta

controller:
  type: robosuite_osc
  scales:
    dx: 0.2
    dy: 0.2
    dz: 0.2
    droll: 0.0628318530717959
    dpitch: 0.0628318530717959
    dyaw: 0.0628318530717959
    gripper: 1.0

agent:
  type: random

logging:
  output_dir: outputs/robosuite_lift
  save_trajectory: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: agentview

benchmark:
  name: dmcontrol_manipulator_bring_ball_mllm_fixed_identity_v0
  num_episodes: 1
  seed: 7

simulator:
  type: dmcontrol
  params:
    domain_name: manipulator
    task_name: bring_ball
    mujoco_gl: egl
  env_kwargs: {}

task:
  type: dmcontrol_generic
  max_steps: 250
  success_threshold: 0.95
  params:
    instruction: "Bring the ball to the target area."
    success_key: "reward"

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: fixed
      type: mujoco_rgb
      width: 320
      height: 240
    - name: hand
      type: mujoco_rgb
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true

controller:
  type: dmcontrol
  scales:
    dx: 0.1
    dy: 0.1
    dz: 0.1
    droll: 0.1
    gripper: 1.0
  params:
    dimensions: [dx, dy, dz, droll, gripper]

agent:
  type: mllm
  action_output_mode: action_with_reflection
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 128
    response_format: json_object
    stream: false
  observation:
    cameras: [fixed, hand]
    image_max_side: 512
  history:
    action_window: all
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/dmcontrol_manipulator_bring_ball_mllm_fixed_identity
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  window_width: 800
  window_height: 600
  fps: 20
  max_steps: 250
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true
  mujoco_gl: egl

benchmark:
  name: rlbench_reach_target_mllm_chat_completions_v0
  num_episodes: 1
  seed: 11

simulator:
  type: rlbench
  env_id: ReachTarget
  control_dt: 0.1
  workspace_bounds:
    low: [-0.6, -0.6, 0.75]
    high: [0.6, 0.6, 1.35]
  params:
    task_class: ReachTarget
    action_mode: move_arm_then_gripper_end_effector_pose_via_planning_discrete
    headless: false
    static_positions: false

task:
  type: rlbench_generic
  max_steps: 40
  success_threshold: 1.0
  params:
    instruction: Move the robot end-effector to the visible target.
    instruction_from_observation: true
    instruction_observation_key: descriptions
    instruction_description_index: 0
    success_key: success
    reject_initial_success: true

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: front
      type: rlbench_rgb
      width: 512
      height: 512

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz]
  gripper: none
  channel_kind: continuous
  channel_min: -30
  channel_max: 30
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the RLBench world Cartesian x, y, and z axes, with translation as the only
    active motion. A mapped magnitude-1 command is a 0.01-meter world-frame
    delta. The benchmark adds that delta without sign compensation to the
    position from the latest observed absolute gripper pose, clamps the target
    to the configured workspace bounds, and sends a native absolute world-frame
    planning pose. The gripper is fixed open and is not controllable; no
    joystick gripper channel exists. The front camera is fixed in the TTT scene:
    world +y projects approximately toward image right, world +z toward image
    up, and world +x mainly toward the camera with a downward image component
  params:
    scale_mode: rlbench_absolute_pose_target_from_delta_eef

controller:
  type: rlbench_delta_eef
  frame: controller
  scales:
    dx: 0.01
    dy: 0.01
    dz: 0.01
  params:
    dimensions: [dx, dy, dz]
    default_gripper: 1.0

agent:
  type: mllm
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [front]
    image_max_side: 512
  history:
    action_window: all
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/rlbench_reach_target_mllm
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: front
  window_width: 720
  window_height: 540
  info_panel_height: 190
  fps: 20
  max_steps: 40
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true

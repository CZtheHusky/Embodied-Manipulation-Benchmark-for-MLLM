benchmark:
  name: language_table_block2block_mllm_chat_completions_v0
  num_episodes: 1
  seed: 7

simulator:
  type: language_table
  params:
    block_mode: BLOCK_4
    reward: blocktoblock
    training: true
    control_frequency: 10.0
    delay_reward_steps: 0
    add_invisible_walls: false

task:
  type: language_table_generic
  max_steps: 200
  success_threshold: 1.0
  params: {}

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: rgb
      type: pybullet_rgb
      width: 320
      height: 180

control_interface:
  mode: planar_eef_delta
  active_dimensions: [dx, dy]
  gripper: none
  channel_kind: continuous
  channel_min: -30
  channel_max: 30
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the Language-Table planar workspace x-y frame. A mapped magnitude-1
    command moves the end-effector target by 0.01 meters along that axis
  params:
    scale_mode: language_table_world_xy_0_01m

controller:
  type: language_table_planar
  scales:
    dx: 0.01
    dy: 0.01
  params:
    dimensions: [dx, dy]

agent:
  type: mllm
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [rgb]
    image_max_side: 512
  history:
    action_window: 3
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/language_table_block2block_mllm
  save_images: false
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: rgb
  window_width: 640
  window_height: 360
  info_panel_height: 190
  fps: 10
  max_steps: 200
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true

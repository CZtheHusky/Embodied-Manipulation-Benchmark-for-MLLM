benchmark:
  name: dmcontrol_manipulator_v0
  num_episodes: 1
  seed: 7

simulator:
  type: dmcontrol
  params:
    domain_name: manipulator
    task_name: bring_ball
    mujoco_gl: egl
  env_kwargs: {}

task:
  type: dmcontrol_generic
  max_steps: 250
  success_threshold: 0.95
  params:
    instruction: "Bring the ball to the target area."
    success_key: "reward"

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: fixed
      type: mujoco_rgb
      width: 320
      height: 240
    - name: hand
      type: mujoco_rgb
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  frame_transform: identity

controller:
  type: dmcontrol
  scales:
    dx: 0.1
    dy: 0.1
    dz: 0.1
    droll: 0.1
    gripper: 1.0
  params:
    dimensions: [dx, dy, dz, droll, gripper]

agent:
  type: random

logging:
  output_dir: outputs/dmcontrol_example
  save_images: false
  save_trajectory: true

ui:
  backend: direct_dmcontrol
  window_width: 800
  window_height: 600
  fps: 20
  mujoco_gl: egl

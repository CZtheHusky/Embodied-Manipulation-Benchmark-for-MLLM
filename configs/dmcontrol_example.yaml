benchmark:
  name: dmcontrol_manipulator_v0
  num_episodes: 1
  seed: 7

simulator:
  type: dmcontrol
  params:
    domain_name: manipulator
    task_name: bring_ball
    mujoco_gl: egl
  env_kwargs: {}

task:
  type: dmcontrol_generic
  max_steps: 250
  success_threshold: 0.95
  params:
    instruction: "Bring the ball to the target area."
    success_key: current_reward
    reject_initial_success: true

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: fixed
      type: mujoco_rgb
      width: 320
      height: 240
    - name: hand
      type: mujoco_rgb
      width: 320
      height: 240

control_interface:
  mode: planar_eef_delta_gripper
  active_dimensions: [dx, dy]
  gripper: effort
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the 2D MuJoCo world x-z plane. A mapped magnitude-1 command requests a
    0.01-meter Cartesian end-effector target displacement
  gripper_open_command: 0
  gripper_closed_command: 1
  gripper_neutral_command: 0.5
  params:
    scale_mode: dmcontrol_world_xz_cartesian_impedance_target_0_01m

controller:
  type: dmcontrol_planar_eef
  scales:
    dx: 0.01
    dy: 0.01
    gripper: 1.0
  params:
    dimensions: [dx, dy, gripper]

agent:
  type: random

logging:
  output_dir: outputs/dmcontrol_example
  save_images: false
  save_trajectory: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  window_width: 800
  window_height: 600
  fps: 20
  mujoco_gl: egl

benchmark:
  name: calvin_delta_eef_v0
  num_episodes: 1
  seed: 42

simulator:
  type: calvin
  env_id: null
  render_mode: rgb_array
  params:
    max_episode_steps: 100
    camera_config: static_and_gripper
    hydra_config_name: config_data_collection
    use_egl: true
    show_gui: false
  env_kwargs:
    use_vr: false
    use_scene_info: true

task:
  type: calvin_generic
  max_steps: 100
  success_threshold: 1.0
  params:
    target_block_color: red
    instruction: Open the drawer, pick up the red block, and place the red block inside the drawer.

camera:
  manager: calvin_randomized
  visible_metadata: true
  cameras:
    - name: static
      type: calvin_rgb
      width: 512
      height: 512
      params:
        position_ranges:
          - [0.5, 1.0]
          - [-0.2, 0.2]
          - [0.4, 0.8]
        look_at_ranges:
          - [-0.1, 0.1]
          - [-0.1, 0.1]
          - [0.0, 0.2]
    - name: gripper
      type: calvin_rgb
      width: 84
      height: 84

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the CALVIN PyBullet world frame. A mapped magnitude-1 benchmark command
    produces a 0.01-meter Cartesian target delta or a
    0.0314159265358979-radian (1.8-degree) XYZ Euler-parameter increment

controller:
  type: calvin_delta_eef
  frame: pybullet_world_xyz
  scales:
    dx: 0.5
    dy: 0.5
    dz: 0.5
    droll: 0.628318530717959
    dpitch: 0.628318530717959
    dyaw: 0.628318530717959
  params:
    dimensions: [dx, dy, dz, droll, dpitch, dyaw, gripper]
    gripper_open_value: 1.0
    gripper_closed_value: -1.0

agent:
  type: random
  invalid_action_recovery: noop
  history_window: 5

logging:
  output_dir: outputs/calvin_delta_eef
  save_images: false
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  info_panel_height: 200
  max_steps: 100
  debug_frames: true
  debug_control_history: true

benchmark:
  name: calvin_delta_eef_mllm_reflection_v0
  num_episodes: 1
  seed: 42

simulator:
  type: calvin
  env_id: null
  render_mode: rgb_array
  params:
    max_episode_steps: 100
    camera_config: static_and_gripper
    hydra_config_name: config_data_collection
    use_egl: true
    show_gui: false
  env_kwargs:
    use_vr: false
    use_scene_info: true

task:
  type: calvin_generic
  max_steps: 100
  success_threshold: 1.0
  params:
    target_block_color: red
    instruction: Open the drawer, pick up the red block, and place the red block inside the drawer.

camera:
  manager: fixed
  visible_metadata: false
  cameras:
    - name: static
      type: calvin_rgb
      width: 200
      height: 200
    - name: gripper
      type: calvin_rgb
      width: 84
      height: 84

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    CALVIN's PyBullet world frame: dx, dy, and dz are normalized
    Cartesian-relative world-coordinate translations, where native magnitude 1
    advances the target by 0.02 m; droll, dpitch, and dyaw are normalized
    increments of the target pose's PyBullet XYZ Euler parameters, where native
    magnitude 1 changes that parameter by 0.05 rad, and are not an axis-angle
    vector; in the fixed static camera, +x projects roughly toward image right,
    +y toward image upper-right, and +z toward image upper-left, while the
    gripper camera moves with the wrist
  gripper_open_command: 1
  gripper_closed_command: 0
  params:
    scale_mode: calvin_cartesian_relative_delta

controller:
  type: calvin_delta_eef
  frame: controller
  scales:
    dx: 1.0
    dy: 1.0
    dz: 1.0
    droll: 1.0
    dpitch: 1.0
    dyaw: 1.0
  params:
    dimensions: [dx, dy, dz, droll, dpitch, dyaw, gripper]
    gripper_open_value: 1.0
    gripper_closed_value: -1.0
    transform_rotation: false

agent:
  type: mllm
  action_output_mode: action_with_reflection
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [static, gripper]
    image_max_side: 512
  history:
    action_window: all
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/calvin_delta_eef_mllm
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: static
  info_panel_height: 200
  max_steps: 100
  debug_frames: true
  debug_control_history: true

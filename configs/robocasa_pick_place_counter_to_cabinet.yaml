benchmark:
  name: robocasa_pick_place_counter_to_cabinet_v0
  num_episodes: 1
  seed: 42

simulator:
  type: robocasa
  env_id: robocasa/PickPlaceCounterToCabinet
  env_kwargs:
    split: pretrain
    camera_widths: 256
    camera_heights: 256

task:
  type: robocasa_generic
  max_steps: 100
  success_threshold: 1.0
  params:
    instruction: Pick the object from the counter and place it in the cabinet.
    instruction_from_observation: true
    instruction_observation_key: annotation.human.task_description

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: robot0_agentview_left
      width: 256
      height: 256
    - name: robot0_agentview_right
      width: 256
      height: 256
    - name: robot0_eye_in_hand
      width: 256
      height: 256

control_interface:
  mode: eef_delta_pose
  active_dimensions: ["dx", "dy", "dz"]
  gripper: direct
  mapping_strategy: fixed
  frame_transform: identity
  control_frame_description: >-
    the PandaOmron OSC robot-base frame. A mapped magnitude-1 translation
    command produces an approximately 0.01-meter end-effector target delta

controller:
  type: robocasa_osc
  scales:
    dx: 0.2
    dy: 0.2
    dz: 0.2
    droll: 0.0628318530717959
    dpitch: 0.0628318530717959
    dyaw: 0.0628318530717959
    gripper: 1.0
  params:
    control_mode: 1.0

agent:
  type: random

logging:
  output_dir: outputs/robocasa_pick_place_counter_to_cabinet
  save_trajectory: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: robot0_agentview_left

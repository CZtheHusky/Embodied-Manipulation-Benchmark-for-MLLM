benchmark:
  name: pusher_delta_eef_v0
  num_episodes: 1
  seed: 7

simulator:
  type: gymnasium
  env_id: MLLMTeleop/PusherDeltaEEF-v0
  render_mode: rgb_array
  frame_skip: 5
  params:
    max_episode_steps: 500
  env_kwargs:
    eef_step_scale: 0.025
    goal_distance_threshold: 0.08
    goal_hold_steps: 3
    workspace_low: [0.1, -0.65, -0.25]
    workspace_high: [0.95, 0.35, 0.25]
    ik_damping: 0.05
    ik_step_scale: 0.75
    ik_max_joint_delta: 0.12
    ik_iters: 20

task:
  type: gymnasium_pusher
  max_steps: 120
  success_threshold: 0.08
  goal_hold_steps: 3

camera:
  manager: mujoco_randomized
  visible_metadata: true
  params:
    distance_range: [1.6, 2.4]
    azimuth_range: [120.0, 180.0]
    elevation_range: [-35.0, -15.0]
    lookat: [0.45, -0.15, -0.15]
  cameras:
    - name: front
      type: mujoco_rgb
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz]
  gripper: none
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  params:
    scale_mode: uniform_env_eef_step_scale_0.025m

controller:
  type: pusher_delta_eef
  frame: world_xyz
  scales:
    dx: 1.0
    dy: 1.0
    dz: 1.0
  params:
    dimensions: [dx, dy, dz]

agent:
  type: random
  invalid_action_recovery: noop
  history_window: 5

logging:
  output_dir: outputs/pusher_delta_eef
  save_images: false
  save_video: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: direct_gymnasium
  window_width: 720
  window_height: 540
  info_panel_height: 190
  fps: 20
  max_steps: 500
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true
  mujoco_gl: egl

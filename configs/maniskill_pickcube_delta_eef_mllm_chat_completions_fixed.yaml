benchmark:
  name: maniskill_pickcube_delta_eef_mllm_chat_completions_fixed_v0
  num_episodes: 1
  seed: 9

simulator:
  type: maniskill
  env_id: PickCube-v1
  render_mode: rgb_array
  wrappers: [cpu_gym_wrapper]
  params:
    control_mode: pd_ee_delta_pose
    max_episode_steps: 100
  env_kwargs:
    obs_mode: rgb
    reward_mode: sparse
    num_envs: 1

task:
  type: maniskill_generic
  max_steps: 100
  success_threshold: 1.0
  params:
    instruction: >-
      Pick up the visible cube and move it to the visible goal marker.
    success_key: success
    reject_initial_success: true

camera:
  manager: fixed
  visible_metadata: false
  cameras:
    - name: render_camera
      type: maniskill_human_rgb
      width: 512
      height: 512
      params:
        source: human_render

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz, droll, dpitch, dyaw]
  gripper: direct
  channel_kind: continuous
  channel_min: -30
  channel_max: 30
  mapping_strategy: fixed
  visible_metadata: true
  mapping_visible_to_agent: true
  frame_transform: identity
  frame_visible_to_agent: true
  control_frame_description: >-
    the Panda root/base frame, fixed and aligned with ManiSkill world axes:
    +x points from the robot base toward the table center, +y runs laterally
    across the table toward the render_camera side, and +z points upward;
    translation deltas and rotation-vector axes are root-aligned rather than
    tool-local. A mapped magnitude-1 translation command is 0.01 meters and a
    mapped magnitude-1 rotation-vector command is 0.0314159265358979 radians
    (1.8 degrees). render_camera
    is a fixed external human-render camera that views the workspace from the
    +x,+y quadrant and does not move with the wrist
  gripper_open_command: 0
  gripper_closed_command: 1
  params:
    scale_mode: maniskill_normalized_pd_ee_delta_pose

controller:
  type: maniskill_delta_eef
  frame: controller
  scales:
    dx: 0.1
    dy: 0.1
    dz: 0.1
    droll: 0.314159265358979
    dpitch: 0.314159265358979
    dyaw: 0.314159265358979
  params:
    dimensions: [dx, dy, dz, droll, dpitch, dyaw, gripper]
    gripper_open_value: -1.0
    gripper_closed_value: 1.0
    rotation_input_sign: -1.0

agent:
  type: mllm
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [render_camera]
    image_max_side: 512
  history:
    action_window: 3
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/maniskill_pickcube_delta_eef_mllm_chat_completions_fixed
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  info_panel_height: 190
  max_steps: 100
  debug_frames: true
  debug_control_history: true

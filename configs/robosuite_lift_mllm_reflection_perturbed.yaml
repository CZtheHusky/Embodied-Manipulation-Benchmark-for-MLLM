benchmark:
  name: robosuite_lift_mllm_reflection_perturbed_v0
  num_episodes: 1
  seed: 42

simulator:
  type: robosuite

task:
  type: robosuite_lift
  max_steps: 100
  success_threshold: 0.04
  params:
    env_name: Lift
    reject_initial_success: true
    robots: ["Panda"]
    camera_names: ["agentview", "robot0_eye_in_hand"]
    camera_width: 320
    camera_height: 240

camera:
  manager: fixed
  visible_metadata: true
  cameras:
    - name: agentview
      width: 320
      height: 240
      params:
        basis_frame: mujoco_world
        image_right_in_world: [0.0, 1.0, 0.0]
        image_up_in_world: [-0.706, 0.0, 0.708]
        basis_approximate: true
    - name: robot0_eye_in_hand
      width: 320
      height: 240

control_interface:
  mode: eef_delta_pose
  active_dimensions: [dx, dy, dz]
  gripper: direct
  channel_kind: discrete
  channel_values: [-1, 0, 1]
  mapping_strategy: permuted_sign_flipped
  visible_metadata: true
  mapping_visible_to_agent: false
  frame_transform: random_rotation_3d
  frame_visible_to_agent: false
  control_frame_description: >-
    the robosuite 1.4.1 OSC MuJoCo world x, y, and z axes; translation-only
    commands are normalized world-frame inputs with native +/-1 mapping to
    +/-0.05 m, and in upright agentview image right is approximately +world y
    while image up is approximately -0.706 world x +0.708 world z.
    robot0_eye_in_hand is wrist-mounted, so its image-plane basis changes with
    end-effector pose and has no fixed world-axis projection. The Panda gripper
    treats values below 0.5 as open, exactly 0.5 as hold, and values above 0.5
    as closed. If a transformed translation component would exceed native
    magnitude 1, all three translation components are uniformly rescaled by the
    largest absolute component; this preserves direction but can reduce step
    length
  gripper_open_command: 0
  gripper_closed_command: 1
  gripper_hold_command: 0.5
  params:
    scale_mode: normalized_robosuite_1_4_1_osc_input_native_0_05m
    native_translation_gain_m: 0.05

controller:
  type: robosuite_osc
  frame: world_xyz
  scales:
    dx: 1.0
    dy: 1.0
    dz: 1.0
    droll: 0.1
    dpitch: 0.1
    dyaw: 0.1
    gripper: 1.0

agent:
  type: mllm
  action_output_mode: action_with_reflection
  invalid_action_recovery: noop
  model:
    provider: openai_compatible
    api: chat_completions
    name_env: MLLM_TELEOP_MODEL
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    require_api_key: true
    timeout_seconds: 60
    max_retries: 2
    retry_backoff_seconds: 1
    retry_backoff_max_seconds: 30
    retry_until_success: true
    reasoning_effort: low
    temperature: 0
    max_output_tokens: 192
    response_format: json_object
    stream: false
  observation:
    cameras: [agentview, robot0_eye_in_hand]
    image_max_side: 512
  history:
    action_window: all
    image_window: 3
    max_images_per_request: 128
    max_request_bytes: 67108864

logging:
  output_dir: outputs/robosuite_lift_mllm
  save_images: false
  save_video: false
  video:
    fps: 2
    step_hold_seconds: 1
    terminal_hold_seconds: 2
    include_evaluator_debug: false
  save_trajectory: true
  save_config_snapshot: true

ui:
  backend: pygame
  runtime: sim_adapter_worker
  frame_camera: agentview
  window_width: 720
  window_height: 540
  info_panel_height: 190
  fps: 20
  max_steps: 500
  step_when_idle: false
  simple_blit: true
  debug_frames: true
  debug_control_history: true
  mujoco_gl: egl

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm-teleop-benchmark"
version = "0.1.0"
description = "A virtual-joystick embodied manipulation benchmark skeleton for MLLM evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cao Zhe" }]
dependencies = [
  "gymnasium>=1.0",
  "imageio>=2.0",
  "mujoco>=3.0",
  "numpy>=1.24",
  "pygame>=2.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mllm_teleop_benchmark = ["sim/gymnasium_envs/envs/assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

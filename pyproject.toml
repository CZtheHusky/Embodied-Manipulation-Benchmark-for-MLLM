[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm-teleop-benchmark"
version = "0.1.0"
description = "A virtual-joystick embodied manipulation benchmark skeleton for MLLM evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cao Zhe" }]
dependencies = [
  "imageio>=2.0",
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
gymnasium = [
  "gymnasium>=1.0",
  "mujoco>=3.0",
]
ui = [
  "pygame>=2.5",
]
maniskill = [
  "mani-skill>=3.0",
]
robosuite = [
  "robosuite==1.4.1",
  "mujoco>=2.3,<3.0",
]
dmcontrol = [
  "dm_control>=1.0",
  "mujoco>=3.0",
]
metaworld = [
  "metaworld>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mllm_teleop_benchmark = ["sim/gymnasium_envs/envs/assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
